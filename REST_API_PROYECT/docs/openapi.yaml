openapi: 3.0.3

info:
  title: API de Jugadores y Rosters
  description: API REST para gestionar jugadores de eSports y armar rosters.
  version: 1.0.0

servers:
  - url: /api/v1
    description: Servidor actual

tags:
  - name: Jugadores
    description: Gestión de jugadores
  - name: Rosters                       
    description: Gestión de rosters
  - name: Asignaciones                  
    description: Jugadores dentro de un roster (Titular o Suplente)
  - name: Auxiliares
    description: Endpoints de apoyo y verificación

paths:
  # ---------------------------- JUGADORES ----------------------------
  /jugadores:
    get:
      tags: [Jugadores]
      summary: Listar jugadores
      description: Devuelve todos los jugadores ordenados por nickname. Admite filtros opcionales que se pueden combinar.
      parameters:
        - name: rol
          in: query
          description: Filtrar por rol
          schema:
            $ref: '#/components/schemas/RolJugador'
        - name: estado
          in: query
          description: Filtrar por estado
          schema:
            $ref: '#/components/schemas/EstadoJugador'
        - name: search
          in: query
          description: Buscar por nickname (coincidencia parcial)
          schema:
            type: string
            example: fak
      responses:
        '200':
          description: Lista de jugadores (puede estar vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Jugador'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    post:
      tags: [Jugadores]
      summary: Crear un jugador
      description: Registra un jugador nuevo. El nickname debe ser único.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JugadorNuevo'
      responses:
        '201':
          description: Jugador creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jugador'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /jugadores/{id}:
    parameters:
      - $ref: '#/components/parameters/IdJugador'

    get:
      tags: [Jugadores]
      summary: Obtener el detalle de un jugador
      responses:
        '200':
          description: Datos del jugador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jugador'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    put:
      tags: [Jugadores]
      summary: Actualizar un jugador
      description: Modifica uno o varios campos. Los campos que no se envíen no cambian.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JugadorActualizacion'
      responses:
        '200':
          description: Jugador actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jugador'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Nickname duplicado, o el nuevo rol choca con otro titular en un roster donde el jugador es titular
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        

    delete:
      tags: [Jugadores]
      summary: Eliminar un jugador
      description: Elimina al jugador y también sus asignaciones a rosters. Los rosters no se eliminan.
      responses:
        '204':
          description: Jugador eliminado (sin contenido)
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ----------------------------- ROSTERS  -----------------------------
  /rosters:
    get:
      tags: [Rosters]
      summary: Listar rosters
      description: Devuelve todos los rosters con la cantidad de jugadores asignados. Admite filtros opcionales que se pueden combinar.
      parameters:
        - name: tipo
          in: query
          description: Filtrar por tipo de roster
          schema:
            $ref: '#/components/schemas/TipoRoster'
        - name: temporada
          in: query
          description: Filtrar por temporada
          schema:
            type: string
            example: '2026'
      responses:
        '200':
          description: Lista de rosters (puede estar vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RosterResumen'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    post:
      tags: [Rosters]
      summary: Crear un roster
      description: Crea un roster vacío. Si no se envía el juego, se guarda League of Legends.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RosterNuevo'
      responses:
        '201':
          description: Roster creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Roster'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /rosters/{id}:
    parameters:
      - $ref: '#/components/parameters/IdRoster'

    get:
      tags: [Rosters]
      summary: Obtener el detalle de un roster
      description: Devuelve los datos del roster junto con la lista de sus jugadores y el rol de cada uno dentro del roster.
      responses:
        '200':
          description: Roster con sus jugadores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterDetalle'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    put:
      tags: [Rosters]
      summary: Actualizar un roster
      description: Modifica uno o varios campos. Los campos que no se envíen no cambian.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RosterActualizacion'
      responses:
        '200':
          description: Roster actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Roster'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    delete:
      tags: [Rosters]
      summary: Eliminar un roster
      description: Elimina el roster y sus asignaciones. Los jugadores permanecen en el sistema.
      responses:
        '204':
          description: Roster eliminado (sin contenido)
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ------------------------- ASIGNACIONES  -------------------------
  /rosters/{id}/jugadores:
    parameters:
      - $ref: '#/components/parameters/IdRoster'

    get:
      tags: [Asignaciones]
      summary: Listar los jugadores de un roster
      responses:
        '200':
          description: Jugadores del roster con su rol dentro de él (puede estar vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JugadorEnRoster'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    post:
      tags: [Asignaciones]
      summary: Asignar un jugador a un roster
      description: |
        Agrega un jugador al roster como Titular o Suplente.

        Reglas que se validan cuando el rol es **Titular**:
        - No puede haber dos titulares con el mismo rol de juego (RN-03).
        - Un roster tiene como máximo 5 titulares (RN-02).

        Como Suplente no hay restricción de rol. Un jugador no puede estar dos veces en el mismo roster.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignacionNueva'
      responses:
        '201':
          description: Jugador asignado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JugadorEnRoster'
        '400':
          description: Falta id_jugador, el id no es un entero, o rol_en_roster no es Titular/Suplente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El roster o el jugador no existen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El jugador ya está en el roster, ya hay un titular con ese rol, o el roster ya tiene 5 titulares
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /rosters/{id}/jugadores/{id_jugador}:
    parameters:
      - $ref: '#/components/parameters/IdRoster'
      - $ref: '#/components/parameters/IdJugadorEnRuta'

    put:
      tags: [Asignaciones]
      summary: Cambiar el rol de un jugador dentro del roster
      description: Cambia entre Titular y Suplente. Al pasar a Titular se validan las mismas reglas que al asignar (RN-02 y RN-03).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignacionCambio'
      responses:
        '200':
          description: Rol actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JugadorEnRoster'
        '400':
          description: Ids inválidos o rol_en_roster no es Titular/Suplente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El roster o el jugador no existen, o el jugador no está asignado a ese roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ya hay un titular con ese rol, o el roster ya tiene 5 titulares
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    delete:
      tags: [Asignaciones]
      summary: Quitar un jugador de un roster
      description: Solo elimina la asignación. El jugador y el roster siguen existiendo.
      responses:
        '204':
          description: Jugador removido del roster (sin contenido)
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '404':
          description: El roster o el jugador no existen, o el jugador no está asignado a ese roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  # ------------------------- AUXILIARES -------------------------
  /roles:                              
    get:
      tags: [Auxiliares]
      summary: Listar los roles de jugador válidos
      description: Devuelve una lista con los posibles roles validos de un jugador
      responses:
        '200':
          description: Roles válidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RolJugador'
                example: [Top, Jungle, Mid, ADC, Support]
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /estados:                             
    get:
      tags: [Auxiliares]
      summary: Listar los estados de jugador válidos
      description: Devuele una lista con los posibles estados validos de un jugador
      responses:
        '200':
          description: Estados válidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EstadoJugador'
                example: [activo, inactivo]
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /tipos-roster:                        # NUEVO
    get:
      tags: [Auxiliares]
      summary: Listar los tipos de roster válidos
      description: Devuelve una lista con los tipos que un roster puede poseer
      responses:
        '200':
          description: Tipos válidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TipoRoster'
                example: [Principal, Academy]
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /health:
    get:
      tags: [Auxiliares]
      summary: Verificar que el API está activa
      description: Comprueba que el API responde y que la base de datos es accesible.
      responses:
        '200':
          description: API y base de datos funcionando
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: connected
        '500':
          $ref: '#/components/responses/ErrorInterno'

components:
  parameters:
    IdJugador:
      name: id
      in: path
      required: true
      description: Identificador del jugador
      schema:
        type: integer
        minimum: 1
        example: 5

    IdRoster:                          
      name: id
      in: path
      required: true
      description: Identificador del roster
      schema:
        type: integer
        minimum: 1
        example: 1

    IdJugadorEnRuta:                   
      name: id_jugador
      in: path
      required: true
      description: Identificador del jugador asignado al roster
      schema:
        type: integer
        minimum: 1
        example: 5

  schemas:
    RolJugador:
      type: string
      enum: [Top, Jungle, Mid, ADC, Support]
      example: Mid

    EstadoJugador:
      type: string
      enum: [activo, inactivo]
      example: activo

    Jugador:
      type: object
      properties:
        id:
          type: integer
          example: 5
        nickname:
          type: string
          example: Faker
        nombre_real:
          type: string
          nullable: true
          example: Lee Sang-hyeok
        pais:
          type: string
          nullable: true
          example: Corea del Sur
        rol:
          $ref: '#/components/schemas/RolJugador'
        estado:
          $ref: '#/components/schemas/EstadoJugador'

    JugadorNuevo:
      type: object
      required: [nickname, rol]
      properties:
        nickname:
          type: string
          maxLength: 50
          description: Debe ser único en todo el sistema
          example: Faker
        nombre_real:
          type: string
          maxLength: 100
          example: Lee Sang-hyeok
        pais:
          type: string
          maxLength: 60
          example: Corea del Sur
        rol:
          $ref: '#/components/schemas/RolJugador'
        estado:
          allOf:
            - $ref: '#/components/schemas/EstadoJugador'
          description: Si se omite, se guarda como activo

    JugadorActualizacion:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 50
          example: Faker
        nombre_real:
          type: string
          maxLength: 100
          example: Lee Sang-hyeok
        pais:
          type: string
          maxLength: 60
          example: Corea del Sur
        rol:
          $ref: '#/components/schemas/RolJugador'
        estado:
          $ref: '#/components/schemas/EstadoJugador'

    # ---- NUEVO: rosters ----
    TipoRoster:
      type: string
      enum: [Principal, Academy]
      example: Principal

    RolEnRoster:
      type: string
      enum: [Titular, Suplente]
      example: Titular

    Roster:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: TL Principal
        juego:
          type: string
          example: League of Legends
        tipo:
          $ref: '#/components/schemas/TipoRoster'
        temporada:
          type: string
          example: '2026'

    RosterResumen:
      description: Roster con la cantidad de jugadores asignados (se usa en el listado)
      allOf:
        - $ref: '#/components/schemas/Roster'
        - type: object
          properties:
            cantidad_jugadores:
              type: integer
              example: 6

    RosterDetalle:
      description: Roster con la lista de sus jugadores
      allOf:
        - $ref: '#/components/schemas/Roster'
        - type: object
          properties:
            jugadores:
              type: array
              items:
                $ref: '#/components/schemas/JugadorEnRoster'

    RosterNuevo:
      type: object
      required: [nombre, tipo, temporada]
      properties:
        nombre:
          type: string
          maxLength: 100
          example: TL Principal
        juego:
          type: string
          maxLength: 100
          default: League of Legends
          description: Si se omite, se guarda League of Legends
          example: League of Legends
        tipo:
          $ref: '#/components/schemas/TipoRoster'
        temporada:
          type: string
          maxLength: 10
          example: '2026'

    RosterActualizacion:
      type: object
      properties:
        nombre:
          type: string
          maxLength: 100
          example: TL Principal
        juego:
          type: string
          maxLength: 100
          example: League of Legends
        tipo:
          $ref: '#/components/schemas/TipoRoster'
        temporada:
          type: string
          maxLength: 10
          example: '2027'

    # -----------------  asignaciones ------------------
    JugadorEnRoster:
      type: object
      properties:
        id:
          type: integer
          example: 5
        nickname:
          type: string
          example: Faker
        rol:
          allOf:
            - $ref: '#/components/schemas/RolJugador'
          description: Rol de juego del jugador (Top, Jungle, ...)
        rol_en_roster:
          allOf:
            - $ref: '#/components/schemas/RolEnRoster'
          description: Si el jugador es titular o suplente en este roster

    AsignacionNueva:
      type: object
      required: [id_jugador, rol_en_roster]
      properties:
        id_jugador:
          type: integer
          minimum: 1
          example: 5
        rol_en_roster:
          $ref: '#/components/schemas/RolEnRoster'

    AsignacionCambio:
      type: object
      required: [rol_en_roster]
      properties:
        rol_en_roster:
          $ref: '#/components/schemas/RolEnRoster'

    Error:
      type: object
      properties:
        error:
          type: string
          example: Jugador no encontrado
        detalles:
          type: array
          description: Mensajes específicos de validación (solo en algunos errores 400)
          items:
            type: string

  responses:
    SolicitudInvalida:
      description: Datos inválidos (campo obligatorio vacío, valor no permitido, id no numérico, JSON mal formado)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoEncontrado:
      description: El recurso no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflicto:
      description: Conflicto con los datos existentes (por ejemplo, nickname duplicado)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ErrorInterno:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'